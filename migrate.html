// Errors of the one-time migration page. Messages are fixed per code and never hold user data or secrets;
// `detail` is only a count (how many records failed), never content.

  NO_META: 'The old vault key data is not in this browser',
  BAD_META: 'The old vault key data is damaged',

  COUNT_MISMATCH: 'The item count does not match',
  BAD_SECRET: 'The transfer password is too short or too weak',
  ABORTED: 'Stopped',
  EXPIRED: 'The decrypted data was dropped after waiting too long',
});

class MigrateError extends Error {
  constructor(code, detail) {
    super(MG_MESSAGES[code] || 'Migration failed');
    this.name = 'MigrateError';
    this.code = MG_MESSAGES[code] ? code : 'SERVER';
    this.detail = Number.isInteger(detail) ? detail : 0;
  }
}

const BYTES_TWO_32 = 4294967296;
const BYTES_RANDOM_CHUNK = 65536; // getRandomValues quota per call
const BYTES_B64_RE = /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/;
const BYTES_UTF8_STRICT = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true });
const BYTES_UTF8_ENCODER = new TextEncoder();

function concatBytes(...arrs) {
  let total = 0;
  for (const a of arrs) total += a.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrs) {
    out.set(a, off);
    off += a.length;
  }
  return out;
}

/** Length-checked comparison that does not stop at the first differing byte. */
function equalBytes(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i += 1) diff |= a[i] ^ b[i];
  return diff === 0;
}

function utf8Encode(str) {
  return BYTES_UTF8_ENCODER.encode(str);
}

/** Strict decode: throws TypeError on malformed UTF-8 and keeps a leading BOM. */
function utf8Decode(bytes) {
  return BYTES_UTF8_STRICT.decode(bytes);
}

function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

/** Strict standard-alphabet base64 with padding; throws SyntaxError otherwise (no whitespace tolerance). */
function fromBase64(str) {
  if (typeof str !== 'string' || !BYTES_B64_RE.test(str)) throw new SyntaxError('Invalid base64');
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
  return out;
}

function randomBytes(n) {
  if (!Number.isInteger(n) || n < 0) throw new RangeError('Invalid byte count');
  const out = new Uint8Array(n);
  for (let off = 0; off < n; off += BYTES_RANDOM_CHUNK) globalThis.crypto.getRandomValues(out.subarray(off, Math.min(n, off + BYTES_RANDOM_CHUNK)));
  return out;
}

function wipeBytes(bytes) {
  bytes.fill(0);
}

function bytesCheckRange(bytes, off, len) {
  if (!Number.isInteger(off) || off < 0 || off + len > bytes.length) throw new RangeError('Offset out of bounds');
}

function readUint32BE(bytes, off) {
  bytesCheckRange(bytes, off, 4);
  return ((bytes[off] * 0x1000000) + ((bytes[off + 1] << 16) | (bytes[off + 2] << 8) | bytes[off + 3])) >>> 0;
}

function writeUint32BE(bytes, off, value) {
  bytesCheckRange(bytes, off, 4);
  if (!Number.isInteger(value) || value < 0 || value >= BYTES_TWO_32) throw new RangeError('Value does not fit in 32 bits');
  bytes[off] = value >>> 24;
  bytes[off + 1] = (value >>> 16) & 255;
  bytes[off + 2] = (value >>> 8) & 255;
  bytes[off + 3] = value & 255;
}

/** Reads an unsigned 64-bit big-endian value; throws RangeError above 2^53-1. */
function readUint64BE(bytes, off) {
  bytesCheckRange(bytes, off, 8);
  const hi = readUint32BE(bytes, off);
  const lo = readUint32BE(bytes, off + 4);
  if (hi > 0x1fffff) throw new RangeError('Value exceeds 2^53-1');
  return hi * BYTES_TWO_32 + lo;
}

/** Writes an unsigned 64-bit big-endian value; only integers 0..2^53-1 are accepted. */
function writeUint64BE(bytes, off, value) {
  bytesCheckRange(bytes, off, 8);
  if (typeof value !== 'number' || !Number.isSafeInteger(value) || value < 0) throw new RangeError('Value must be an integer in 0..2^53-1');
  writeUint32BE(bytes, off, Math.floor(value / BYTES_TWO_32));
  writeUint32BE(bytes, off + 4, value % BYTES_TWO_32);
}

// ===== src/migrate/legacy.js =====
// Crypto of the old MyVault page (docs/handoff.md). Read side only: nothing here encrypts for the old format.
// The master is used exactly as the old page used it: UTF-8 of the typed text, no normalisation, no trimming.



const MG_IV_LEN = 12;
const MG_DEFAULT_ITERATIONS = 600000;
const MG_MIN_ITERATIONS = 1000;
const MG_MAX_ITERATIONS = 2000000;
const MG_V2_SALT = 'myvault_personal_salt_2026_unique';
const MG_V2_ITERATIONS = 100000;
const MG_HKDF_INFO = 'MyVault record v3';

const mgIsObj = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);

function mgB64(v) {
  try {
    return fromBase64(v);
  } catch {
    return null;
  }
}

/**
 * Reads the text kept by the old page under localStorage["mv_v3_meta"].
 * @returns {{iterations:number, salt:Uint8Array, wrapIv:Uint8Array, wrapCt:Uint8Array}}
 */
function parseLegacyMeta(text) {
  if (typeof text !== 'string' || text === '') throw new MigrateError('NO_META');
  let meta;
  try {
    meta = JSON.parse(text);
  } catch {
    throw new MigrateError('BAD_META');
  }
  if (!mgIsObj(meta) || meta.version !== 3 || !mgIsObj(meta.passwordWrap)) throw new MigrateError('BAD_META');
  const iterations = meta.iterations === undefined ? MG_DEFAULT_ITERATIONS : meta.iterations;
  if (!Number.isInteger(iterations) || iterations < MG_MIN_ITERATIONS || iterations > MG_MAX_ITERATIONS) throw new MigrateError('BAD_META');
  const salt = mgB64(meta.salt);
  const wrapIv = mgB64(meta.passwordWrap.iv);
  const wrapCt = mgB64(meta.passwordWrap.ct);
  if (!salt || !wrapIv || !wrapCt || salt.length === 0 || wrapIv.length !== MG_IV_LEN || wrapCt.length < 17) throw new MigrateError('BAD_META');
  return { iterations, salt, wrapIv, wrapCt };
}

async function mgPbkdf2Key(masterBytes, salt, iterations) {
  const subtle = globalThis.crypto.subtle;
  const base = await subtle.importKey('raw', masterBytes, 'PBKDF2', false, ['deriveKey']);
  return subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

/** Opens the wrapped vault key with the master. A wrong master (or damaged data) is WRONG_MASTER. @returns {Promise<Uint8Array>} 32 raw bytes */
const unwrapVaultKey = async (meta, master) => {
  if (typeof master !== 'string' || master === '') throw new MigrateError('WRONG_MASTER');
  const bytes = utf8Encode(master);
  try {
    const key = await mgPbkdf2Key(bytes, meta.salt, meta.iterations);
    const raw = await globalThis.crypto.subtle.decrypt({ name: 'AES-GCM', iv: meta.wrapIv }, key, meta.wrapCt);
    return new Uint8Array(raw);
  } catch {
    throw new MigrateError('WRONG_MASTER');
  } finally {
    wipeBytes(bytes);
  }
};

/** 'empty' | 'v3' | 'v2' | 'legacy' (no known prefix: the old CryptoJS format). */
function recordKind(text) {
  if (text === undefined || text === null || text === '') return 'empty';
  if (typeof text !== 'string') return 'legacy';
  if (text.startsWith('v3:')) return 'v3';
  if (text.startsWith('v2:')) return 'v2';
  return 'legacy';
}

function mgHex(str) {
  if (typeof str !== 'string' || str.length === 0 || str.length % 2 !== 0 || !/^[0-9a-fA-F]+$/.test(str)) return null;
  const out = new Uint8Array(str.length / 2);
  for (let i = 0; i < out.length; i += 1) out[i] = parseInt(str.slice(i * 2, i * 2 + 2), 16);
  return out;
}

/**
 * Decrypts records of one old vault. rawKey is the unwrapped vault key; master is only needed for the v2 records.
 * read() returns the plain text, '' for an empty record, and throws MigrateError: LEGACY_RECORD (no prefix) or DECRYPT_FAILED.
 */
function createRecordReader(rawKey, master) {
  let hkdfBase = null;
  let v2Key = null;

  const readV3 = async (text) => {
    const p = text.split(':');
    const salt = p.length === 4 ? mgB64(p[1]) : null;
    const iv = p.length === 4 ? mgB64(p[2]) : null;
    const ct = p.length === 4 ? mgB64(p[3]) : null;
    if (!salt || !iv || !ct || iv.length !== MG_IV_LEN || ct.length < 16) throw new MigrateError('DECRYPT_FAILED');
    const subtle = globalThis.crypto.subtle;
    if (!hkdfBase) hkdfBase = await subtle.importKey('raw', rawKey, 'HKDF', false, ['deriveKey']);
    const key = await subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: utf8Encode(MG_HKDF_INFO) }, hkdfBase, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  };

  const readV2 = async (text) => {
    const p = text.split(':');
    const iv = p.length === 3 ? mgHex(p[1]) : null;
    const ct = p.length === 3 ? mgB64(p[2]) : null;
    if (!iv || !ct || iv.length !== MG_IV_LEN || ct.length < 16) throw new MigrateError('DECRYPT_FAILED');
    if (!v2Key) {
      const bytes = utf8Encode(master);
      try {
        v2Key = await mgPbkdf2Key(bytes, utf8Encode(MG_V2_SALT), MG_V2_ITERATIONS);
      } finally {
        wipeBytes(bytes);
      }
    }
    return globalThis.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, v2Key, ct);
  };

  return {
    async read(text) {
      const kind = recordKind(text);
      if (kind === 'empty') return '';
      if (kind === 'legacy') throw new MigrateError('LEGACY_RECORD');
      try {
        const plain = kind === 'v3' ? await readV3(text) : await readV2(text);
        return utf8Decode(new Uint8Array(plain));
      } catch {
        throw new MigrateError('DECRYPT_FAILED');
      }
    },
  };
}

async function mgSha256Hex(text) {
  const digest = new Uint8Array(await globalThis.crypto.subtle.digest('SHA-256', utf8Encode(text)));
  let hex = '';
  for (const b of digest) hex += b.toString(16).padStart(2, '0');
  return hex;
}

/** proof = sha256Hex('myvault-bootstrap:' + master) */
function bootstrapProof(master) {
  return mgSha256Hex('myvault-bootstrap:' + master);
}

/** response = sha256Hex(proof + ':' + challenge) */
function sessionResponse(proof, challenge) {
  return mgSha256Hex(proof + ':' + challenge);
}

// ===== src/migrate/gas.js =====
// Tiny client for the old Apps Script web app. Only the two request shapes of the old page:
// GET url?action=..&k=v and POST with Content-Type text/plain (a "simple" request, so no CORS preflight).


const MG_TIMEOUT_MS = 30000;

/**
 * @param {{gasUrl:string, fetchFn:Function, timeoutMs?:number, signal?:AbortSignal}} cfg
 * @returns {{get:(params:object)=>Promise<any>, post:(body:object)=>Promise<any>}}
 */
function createGasClient(cfg) {
  const timeoutMs = cfg.timeoutMs || MG_TIMEOUT_MS;
  const send = async (url, init) => {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    const onAbort = () => ctl.abort();
    if (cfg.signal) cfg.signal.addEventListener('abort', onAbort);
    try {
      const res = await cfg.fetchFn(url, { ...init, credentials: 'omit', redirect: 'follow', referrerPolicy: 'no-referrer', signal: ctl.signal });
      if (!res || !res.ok) throw new MigrateError('SERVER');
      return await res.json();
    } catch (e) {
      if (e instanceof MigrateError) throw e;
      throw new MigrateError(cfg.signal && cfg.signal.aborted ? 'ABORTED' : 'SERVER');
    } finally {
      clearTimeout(timer);
      if (cfg.signal) cfg.signal.removeEventListener('abort', onAbort);
    }
  };
  return {
    get(params) {
      const query = Object.keys(params).map((k) => k + '=' + encodeURIComponent(params[k])).join('&');
      return send(cfg.gasUrl + '?' + query, { method: 'GET' });
    },
    post(body) {
      return send(cfg.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
    },
  };
}

// ===== src/container.js =====
// Binary container format (plan section 3). Every pre-KDF check lives in parseContainer.
// Layout, big-endian: magic(4) version(1) type(1) kdfId(1) cipherId(1) iterations(4) salt(16)
// iv(12) vaultId(16) rev(8) createdAt(8) ctLen(4) = 76 header bytes, then ciphertext + 16-byte tag.


const HEADER_LEN = 76;
const CONTAINER_TYPE = Object.freeze({ LOCAL: 1, BACKUP: 2, SHARE: 3, DRAFT: 4 });
const MIN_ITERATIONS = 600000;
const MAX_ITERATIONS = 2000000;
const MAX_FILE_BYTES = 20 * 1024 * 1024;
const MAX_CT_BYTES = 16 * 1024 * 1024 + 16;

const CNT_MAGIC = [0x56, 0x4c, 0x54, 0x32]; // "VLT2"
const CNT_VERSION = 1;
const CNT_KDF_PBKDF2_SHA256 = 1;
const CNT_CIPHER_AES_256_GCM = 1;
const CNT_TAG_LEN = 16;
const CNT_DEFAULT_TYPES = [CONTAINER_TYPE.LOCAL, CONTAINER_TYPE.BACKUP, CONTAINER_TYPE.SHARE];

// Fixed messages per code: they never contain user data, file contents or secrets.
const CNT_MESSAGES = Object.freeze({
  BAD_INPUT: 'Invalid input',
  FILE_TOO_LARGE: 'File is too large',
  TOO_SHORT: 'File is too short',
  BAD_MAGIC: 'Not a vault file',
  BAD_VERSION: 'Unsupported format version',
  BAD_KDF: 'Unsupported key derivation',
  BAD_CIPHER: 'Unsupported cipher',
  BAD_ITERATIONS: 'Iteration count out of range',
  BAD_CT_LEN: 'Invalid ciphertext length',
  BAD_LENGTH: 'File length does not match header',
  BAD_TYPE: 'File type not allowed here',
  BAD_REV: 'Invalid revision',
  BAD_CREATED_AT: 'Invalid creation time',
  BAD_FIELD: 'Invalid header field',
  SECRET_EMPTY: 'Secret is empty',
  SECRET_TOO_LONG: 'Secret is too long',
  SECRET_INVALID: 'Secret is not valid text',
  TOO_LARGE: 'Data is too large',
  DECRYPT_FAILED: 'Wrong password, or the file is damaged or was modified',
});

class ContainerError extends Error {
  constructor(code) {
    super(CNT_MESSAGES[code] || CNT_MESSAGES.BAD_INPUT);
    this.name = 'ContainerError';
    this.code = CNT_MESSAGES[code] ? code : 'BAD_INPUT';
  }
}

function cntIsBytes(x, len) {
  return x instanceof Uint8Array && (len === undefined || x.length === len);
}

function cntSmallUint(v, max) {
  return Number.isInteger(v) && v >= 0 && v <= max;
}

/**
 * Builds the 76-byte header. Validates every field so we never write a file we would refuse to read.
 * @param {{type:number, iterations:number, salt:Uint8Array, iv:Uint8Array, vaultId:Uint8Array, rev:number, createdAt:number, ctLen:number}} fields
 */
function encodeHeader(fields) {
  const f = fields || {};
  const types = Object.values(CONTAINER_TYPE);
  if (!types.includes(f.type)) throw new ContainerError('BAD_TYPE');
  if (!cntSmallUint(f.iterations, 0xffffffff) || f.iterations < MIN_ITERATIONS || f.iterations > MAX_ITERATIONS) throw new ContainerError('BAD_ITERATIONS');
  if (!cntIsBytes(f.salt, 16) || !cntIsBytes(f.iv, 12) || !cntIsBytes(f.vaultId, 16)) throw new ContainerError('BAD_FIELD');
  if (!cntSmallUint(f.rev, Number.MAX_SAFE_INTEGER)) throw new ContainerError('BAD_REV');
  if (!cntSmallUint(f.createdAt, Number.MAX_SAFE_INTEGER)) throw new ContainerError('BAD_CREATED_AT');
  if (!cntSmallUint(f.ctLen, MAX_CT_BYTES) || f.ctLen < CNT_TAG_LEN) throw new ContainerError('BAD_CT_LEN');
  const h = new Uint8Array(HEADER_LEN);
  h.set(CNT_MAGIC, 0);
  h[4] = CNT_VERSION;
  h[5] = f.type;
  h[6] = CNT_KDF_PBKDF2_SHA256;
  h[7] = CNT_CIPHER_AES_256_GCM;
  writeUint32BE(h, 8, f.iterations);
  h.set(f.salt, 12);
  h.set(f.iv, 28);
  h.set(f.vaultId, 40);
  writeUint64BE(h, 56, f.rev);
  writeUint64BE(h, 64, f.createdAt);
  writeUint32BE(h, 72, f.ctLen);
  return h;
}

/**
 * Parses and validates a container without touching any key derivation.
 * DRAFT is accepted only when listed in allowedTypes (default: LOCAL, BACKUP, SHARE).
 * @param {Uint8Array} bytes
 * @param {{allowedTypes?: number[]}} [opts]
 */
function parseContainer(bytes, opts = {}) {
  if (!cntIsBytes(bytes)) throw new ContainerError('BAD_INPUT');
  const allowed = opts.allowedTypes === undefined ? CNT_DEFAULT_TYPES : opts.allowedTypes;
  if (!Array.isArray(allowed)) throw new ContainerError('BAD_INPUT');
  if (bytes.length > MAX_FILE_BYTES) throw new ContainerError('FILE_TOO_LARGE');
  if (bytes.length < HEADER_LEN + CNT_TAG_LEN) throw new ContainerError('TOO_SHORT');
  for (let i = 0; i < 4; i += 1) if (bytes[i] !== CNT_MAGIC[i]) throw new ContainerError('BAD_MAGIC');
  if (bytes[4] !== CNT_VERSION) throw new ContainerError('BAD_VERSION');
  const type = bytes[5];
  if (!Object.values(CONTAINER_TYPE).includes(type) || !allowed.includes(type)) throw new ContainerError('BAD_TYPE');
  if (bytes[6] !== CNT_KDF_PBKDF2_SHA256) throw new ContainerError('BAD_KDF');
  if (bytes[7] !== CNT_CIPHER_AES_256_GCM) throw new ContainerError('BAD_CIPHER');
  const iterations = readUint32BE(bytes, 8);
  if (iterations < MIN_ITERATIONS || iterations > MAX_ITERATIONS) throw new ContainerError('BAD_ITERATIONS');
  const ctLen = readUint32BE(bytes, 72);
  if (ctLen < CNT_TAG_LEN || ctLen > MAX_CT_BYTES) throw new ContainerError('BAD_CT_LEN');
  if (bytes.length !== HEADER_LEN + ctLen) throw new ContainerError('BAD_LENGTH');
  let rev;
  let createdAt;
  try {
    rev = readUint64BE(bytes, 56);
  } catch {
    throw new ContainerError('BAD_REV');
  }
  try {
    createdAt = readUint64BE(bytes, 64);
  } catch {
    throw new ContainerError('BAD_CREATED_AT');
  }
  return {
    version: bytes[4],
    type,
    kdfId: bytes[6],
    cipherId: bytes[7],
    iterations,
    salt: bytes.slice(12, 28),
    iv: bytes.slice(28, 40),
    vaultId: bytes.slice(40, 56),
    rev,
    createdAt,
    ctLen,
    header: bytes.slice(0, HEADER_LEN),
    ciphertext: bytes.slice(HEADER_LEN),
  };
}

// ===== src/crypto.js =====
// Key derivation and container encryption. Uses only WebCrypto (globalThis.crypto).



const CRY_MAX_SECRET_CHARS = 1024;
const CRY_SALT_LEN = 16;
const CRY_IV_LEN = 12;
const CRY_TAG_BITS = 128;

function cryHasLoneSurrogate(str) {
  for (let i = 0; i < str.length; i += 1) {
    const c = str.charCodeAt(i);
    if (c >= 0xd800 && c <= 0xdbff) {
      const next = str.charCodeAt(i + 1);
      if (!(next >= 0xdc00 && next <= 0xdfff)) return true;
      i += 1;
    } else if (c >= 0xdc00 && c <= 0xdfff) {
      return true;
    }
  }
  return false;
}

/**
 * NFC-normalizes and UTF-8 encodes a master or share password. No trimming.
 * The limit counts Unicode characters after NFC; longer input is rejected, never truncated.
 * @param {string} str
 * @returns {Uint8Array}
 */
function normalizeSecret(str) {
  if (typeof str !== 'string') throw new ContainerError('SECRET_INVALID');
  if (cryHasLoneSurrogate(str)) throw new ContainerError('SECRET_INVALID');
  const nfc = str.normalize('NFC');
  if (nfc.length === 0) throw new ContainerError('SECRET_EMPTY');
  let chars = 0;
  for (const ch of nfc) {
    chars += 1;
    if (chars > CRY_MAX_SECRET_CHARS) throw new ContainerError('SECRET_TOO_LONG');
  }
  return utf8Encode(nfc);
}

/**
 * PBKDF2-SHA256 -> AES-GCM 256, non-extractable. secretBytes is overwritten with zeros afterwards,
 * including when anything fails.
 * @param {Uint8Array} secretBytes
 * @param {Uint8Array} salt 16 bytes
 * @param {number} iterations within [MIN_ITERATIONS, MAX_ITERATIONS]
 * @returns {Promise<CryptoKey>}
 */
const deriveVaultKey = async (secretBytes, salt, iterations) => {
  try {
    if (!(secretBytes instanceof Uint8Array)) throw new ContainerError('BAD_INPUT');
    if (!(salt instanceof Uint8Array) || salt.length !== CRY_SALT_LEN) throw new ContainerError('BAD_FIELD');
    if (!Number.isInteger(iterations) || iterations < MIN_ITERATIONS || iterations > MAX_ITERATIONS) throw new ContainerError('BAD_ITERATIONS');
    const subtle = globalThis.crypto.subtle;
    const base = await subtle.importKey('raw', secretBytes, 'PBKDF2', false, ['deriveKey']);
    return await subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt'],
    );
  } finally {
    if (secretBytes instanceof Uint8Array) wipeBytes(secretBytes);
  }
};

/**
 * Encrypts plaintext into a complete container. A fresh random IV is generated on every call;
 * the whole 76-byte header is the AAD.
 * @param {CryptoKey} key
 * @param {{salt:Uint8Array, iterations:number, type:number, vaultId:Uint8Array, rev:number, createdAt:number, plaintext:Uint8Array}} f
 * @returns {Promise<Uint8Array>}
 */
const encryptContainer = async (key, f) => {
  const fields = f || {};
  if (!(fields.plaintext instanceof Uint8Array)) throw new ContainerError('BAD_INPUT');
  if (fields.plaintext.length + 16 > MAX_CT_BYTES) throw new ContainerError('TOO_LARGE');
  const header = encodeHeader({
    type: fields.type,
    iterations: fields.iterations,
    salt: fields.salt,
    iv: randomBytes(CRY_IV_LEN),
    vaultId: fields.vaultId,
    rev: fields.rev,
    createdAt: fields.createdAt,
    ctLen: fields.plaintext.length + 16,
  });
  let ct;
  try {
    ct = new Uint8Array(await globalThis.crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: header.subarray(28, 28 + CRY_IV_LEN), additionalData: header, tagLength: CRY_TAG_BITS },
      key,
      fields.plaintext,
    ));
  } catch {
    throw new ContainerError('BAD_INPUT');
  }
  return concatBytes(header, ct);
};

/**
 * Decrypts a parsed container. Any failure (wrong key, modified header or ciphertext) is the same
 * ContainerError with code DECRYPT_FAILED.
 * @param {CryptoKey} key
 * @param {object} parsed result of parseContainer
 * @returns {Promise<Uint8Array>}
 */
const decryptContainer = async (key, parsed) => {
  try {
    if (!parsed || parsed.header.length !== HEADER_LEN) throw new Error('bad parsed');
    const plain = await globalThis.crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: parsed.header.subarray(28, 28 + CRY_IV_LEN), additionalData: parsed.header, tagLength: CRY_TAG_BITS },
      key,
      parsed.ciphertext,
    );
    return new Uint8Array(plain);
  } catch {
    throw new ContainerError('DECRYPT_FAILED');
  }
};

  ITEMS_MAX: 'Too many items',
  CATEGORIES_MAX: 'Too many categories',
  TITLE_TOO_LONG: 'Title is too long',
  USERNAME_TOO_LONG: 'Username is too long',
  PASSWORD_TOO_LONG: 'Password is too long',
  URL_TOO_LONG: 'Address is too long',
  DOMAIN_TOO_LONG: 'Domain is too long',
  NOTES_TOO_LONG: 'Notes are too long',
  CUSTOM_FIELDS_MAX: 'Too many custom fields',
  LABEL_TOO_LONG: 'Field label is too long',
  VALUE_TOO_LONG: 'Field value is too long',
  CATEGORY_NAME_TOO_LONG: 'Category name is too long',
  PLAINTEXT_TOO_LARGE: 'Vault data is too large',
});

class ModelError extends Error {
  constructor(code) {
    super(MDL_MESSAGES[code] || MDL_MESSAGES.BAD_INPUT);
    this.name = 'ModelError';
    this.code = MDL_MESSAGES[code] ? code : 'BAD_INPUT';
  }
}

const MDL_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const MDL_KINDS = ['text', 'secret', 'pin', 'card'];
const MDL_PATCHABLE = ['title', 'username', 'password', 'url', 'domain', 'categoryId', 'favorite', 'notes', 'customFields'];
const MDL_DEFAULT_GENERATOR = Object.freeze({ length: 20, lower: true, upper: true, digits: true, symbols: true });

const mdlIsObj = (v) => typeof v === 'object' && v !== null && !Array.isArray(v);
const mdlGet = (o, k) => (Object.hasOwn(o, k) ? o[k] : undefined);
const mdlTime = (v, dflt) => (Number.isSafeInteger(v) && v >= 0 ? v : dflt);
const mdlBool = (v, dflt) => (typeof v === 'boolean' ? v : dflt);
const mdlValidId = (v) => typeof v === 'string' && MDL_ID_RE.test(v);

function mdlStr(v, max, tooLong, bad) {
  if (v === undefined) return '';
  if (typeof v !== 'string') throw new ModelError(bad);
  if (v.length > max) throw new ModelError(tooLong);
  return v;
}

/** Empty string, or an http(s) URL without whitespace or control characters; otherwise null. */
function mdlSafeUrl(url) {
  if (url === '') return '';
  if (/[\s\u0000-\u001f\u007f]/.test(url)) return null;
  try {
    const p = new URL(url).protocol;
    return p === 'http:' || p === 'https:' ? url : null;
  } catch {
    return null;
  }
}

function mdlCustomFields(src) {
  if (src === undefined) return [];
  if (!Array.isArray(src)) throw new ModelError('INVALID_ITEM');
  if (src.length > MODEL_LIMITS.customFields) throw new ModelError('CUSTOM_FIELDS_MAX');
  const seen = new Set();
  return src.map((f) => {
    if (!mdlIsObj(f)) throw new ModelError('INVALID_ITEM');
    const id = mdlGet(f, 'id');
    const kind = mdlGet(f, 'kind');
    if (!mdlValidId(id) || seen.has(id) || !MDL_KINDS.includes(kind)) throw new ModelError('INVALID_ITEM');
    seen.add(id);
    return {
      id,
      label: mdlStr(mdlGet(f, 'label'), MODEL_LIMITS.label, 'LABEL_TOO_LONG', 'INVALID_ITEM'),
      kind,
      value: mdlStr(mdlGet(f, 'value'), MODEL_LIMITS.value, 'VALUE_TOO_LONG', 'INVALID_ITEM'),
    };
  });
}

/** Builds one clean item from untrusted input. strict: unsafe URLs and unknown categories are errors, else repaired. */
function mdlItem(src, catIds, strict) {
  if (!mdlIsObj(src)) throw new ModelError('INVALID_ITEM');
  const id = mdlGet(src, 'id');
  if (!mdlValidId(id)) throw new ModelError('INVALID_ITEM');
  const url = mdlStr(mdlGet(src, 'url'), MODEL_LIMITS.url, 'URL_TOO_LONG', 'INVALID_ITEM');
  let safeUrl = mdlSafeUrl(url);
  if (safeUrl === null) {
    if (strict) throw new ModelError('BAD_URL');
    safeUrl = '';
  }
  let categoryId = mdlGet(src, 'categoryId');
  if (categoryId === undefined || categoryId === null) {
    categoryId = null;
  } else if (typeof categoryId !== 'string' || !catIds.has(categoryId)) {
    if (strict) throw new ModelError('CATEGORY_NOT_FOUND');
    categoryId = null;
  }
  const createdAt = mdlTime(mdlGet(src, 'createdAt'), 0);
  return {
    id,
    title: mdlStr(mdlGet(src, 'title'), MODEL_LIMITS.title, 'TITLE_TOO_LONG', 'INVALID_ITEM'),
    username: mdlStr(mdlGet(src, 'username'), MODEL_LIMITS.username, 'USERNAME_TOO_LONG', 'INVALID_ITEM'),
    password: mdlStr(mdlGet(src, 'password'), MODEL_LIMITS.password, 'PASSWORD_TOO_LONG', 'INVALID_ITEM'),
    url: safeUrl,
    domain: mdlStr(mdlGet(src, 'domain'), MODEL_LIMITS.domain, 'DOMAIN_TOO_LONG', 'INVALID_ITEM'),
    categoryId,
    favorite: mdlBool(mdlGet(src, 'favorite'), false),
    notes: mdlStr(mdlGet(src, 'notes'), MODEL_LIMITS.notes, 'NOTES_TOO_LONG', 'INVALID_ITEM'),
    customFields: mdlCustomFields(mdlGet(src, 'customFields')),
    createdAt,
    updatedAt: mdlTime(mdlGet(src, 'updatedAt'), createdAt),
    passwordChangedAt: mdlTime(mdlGet(src, 'passwordChangedAt'), createdAt),
  };
}

function mdlGenerator(src) {
  const g = mdlIsObj(src) ? src : {};
  const len = mdlGet(g, 'length');
  return {
    length: Number.isInteger(len) && len >= 8 && len <= 128 ? len : MDL_DEFAULT_GENERATOR.length,
    lower: mdlBool(mdlGet(g, 'lower'), true),
    upper: mdlBool(mdlGet(g, 'upper'), true),
    digits: mdlBool(mdlGet(g, 'digits'), true),
    symbols: mdlBool(mdlGet(g, 'symbols'), true),
  };
}

function mdlNormalize(src, strict) {
  if (!mdlIsObj(src)) throw new ModelError('INVALID_MODEL');
  if (mdlGet(src, 'schema') !== 1) throw new ModelError('BAD_SCHEMA');
  const catsSrc = mdlGet(src, 'categories') === undefined ? [] : mdlGet(src, 'categories');
  const itemsSrc = mdlGet(src, 'items') === undefined ? [] : mdlGet(src, 'items');
  if (!Array.isArray(catsSrc) || !Array.isArray(itemsSrc)) throw new ModelError('INVALID_MODEL');
  if (catsSrc.length > MODEL_LIMITS.categories) throw new ModelError('CATEGORIES_MAX');
  if (itemsSrc.length > MODEL_LIMITS.items) throw new ModelError('ITEMS_MAX');

  const catIds = new Set();
  const categories = catsSrc.map((c) => {
    if (!mdlIsObj(c)) throw new ModelError('INVALID_CATEGORY');
    const id = mdlGet(c, 'id');
    const name = mdlGet(c, 'name');
    if (!mdlValidId(id) || typeof name !== 'string' || name.length === 0) throw new ModelError('INVALID_CATEGORY');
    if (name.length > MODEL_LIMITS.categoryName) throw new ModelError('CATEGORY_NAME_TOO_LONG');
    if (catIds.has(id)) throw new ModelError('DUPLICATE_ID');
    catIds.add(id);
    return { id, name };
  });

  const itemIds = new Set();
  const items = itemsSrc.map((it) => {
    const clean = mdlItem(it, catIds, strict);
    if (itemIds.has(clean.id)) throw new ModelError('DUPLICATE_ID');
    itemIds.add(clean.id);
    return clean;
  });

  const settingsSrc = mdlGet(src, 'settings');
  const settings = mdlIsObj(settingsSrc) ? settingsSrc : {};
  const backupSrc = mdlGet(src, 'backup');
  const backup = mdlIsObj(backupSrc) ? backupSrc : {};
  const createdAt = mdlTime(mdlGet(src, 'createdAt'), 0);
  return {
    schema: 1,
    createdAt,
    updatedAt: mdlTime(mdlGet(src, 'updatedAt'), createdAt),
    settings: { generator: mdlGenerator(mdlGet(settings, 'generator')) },
    categories,
    items,
    backup: { lastAt: mdlTime(mdlGet(backup, 'lastAt'), 0), lastRev: mdlTime(mdlGet(backup, 'lastRev'), 0) },
  };
}

/** Checks a trusted model; throws ModelError with a fixed code, returns true otherwise. */
function validateModel(model) {
  mdlNormalize(model, true);
  return true;
}

/** Allowlist copy of untrusted data. Unknown keys and unsafe URLs are dropped; limits are errors. */
function sanitizeModel(untrusted) {
  return mdlNormalize(untrusted, false);
}

function serializeModel(model) {
  const bytes = utf8Encode(JSON.stringify(mdlNormalize(model, true)));
  if (bytes.length > MODEL_LIMITS.plaintext) throw new ModelError('PLAINTEXT_TOO_LARGE');
  return bytes;
}

/** Bytes (strict UTF-8) -> sanitized model. */
function parseModel(bytes) {
  let parsed;
  try {
    parsed = JSON.parse(utf8Decode(bytes));
  } catch {
    throw new ModelError('BAD_JSON');
  }
  return sanitizeModel(parsed);
}

function createEmptyModel({ now, categories = [] } = {}) {
  if (!Number.isSafeInteger(now) || now < 0) throw new ModelError('BAD_INPUT');
  const model = {
    schema: 1,
    createdAt: now,
    updatedAt: now,
    settings: { generator: { ...MDL_DEFAULT_GENERATOR } },
    categories: categories.map((c) => ({ id: c.id, name: c.name })),
    items: [],
    backup: { lastAt: 0, lastRev: 0 },
  };
  mdlNormalize(model, true);
  return model;
}

function mdlNow(opts) {
  const now = opts && opts.now;
  if (!Number.isSafeInteger(now) || now < 0) throw new ModelError('BAD_INPUT');
  return now;
}

const mdlCatIds = (model) => new Set(model.categories.map((c) => c.id));

function mdlIndex(model, id) {
  const idx = model.items.findIndex((i) => i.id === id);
  if (idx < 0) throw new ModelError('NOT_FOUND');
  return idx;
}

function addItem(model, fields, opts) {
  const now = mdlNow(opts);
  const id = opts.id;
  if (!mdlIsObj(fields)) throw new ModelError('INVALID_ITEM');
  if (model.items.length >= MODEL_LIMITS.items) throw new ModelError('ITEMS_MAX');
  if (model.items.some((i) => i.id === id)) throw new ModelError('DUPLICATE_ID');
  const item = mdlItem({ ...fields, id, createdAt: now, updatedAt: now, passwordChangedAt: now }, mdlCatIds(model), true);
  return { ...model, updatedAt: now, items: [...model.items, item] };
}

function updateItem(model, id, patch, opts) {
  const now = mdlNow(opts);
  const idx = mdlIndex(model, id);
  if (!mdlIsObj(patch)) throw new ModelError('INVALID_ITEM');
  const old = model.items[idx];
  const next = { ...old, updatedAt: now };
  for (const k of MDL_PATCHABLE) if (Object.hasOwn(patch, k)) next[k] = patch[k];
  if (typeof next.password === 'string' && next.password !== old.password) next.passwordChangedAt = now;
  const item = mdlItem(next, mdlCatIds(model), true);
  const items = model.items.slice();
  items[idx] = item;
  return { ...model, updatedAt: now, items };
}

function setFavorite(model, id, favorite, opts) {
  return updateItem(model, id, { favorite: favorite === true }, opts);
}

function deleteItem(model, id, opts) {
  const now = mdlNow(opts);
  const idx = mdlIndex(model, id);
  return { ...model, updatedAt: now, items: model.items.filter((_, i) => i !== idx) };
}

function mdlCategoryName(name) {
  if (typeof name !== 'string' || name.length === 0) throw new ModelError('INVALID_CATEGORY');
  if (name.length > MODEL_LIMITS.categoryName) throw new ModelError('CATEGORY_NAME_TOO_LONG');
  return name;
}

function addCategory(model, category, opts) {
  const now = mdlNow(opts);
  if (!mdlIsObj(category) || !mdlValidId(category.id)) throw new ModelError('INVALID_CATEGORY');
  if (model.categories.length >= MODEL_LIMITS.categories) throw new ModelError('CATEGORIES_MAX');
  if (model.categories.some((c) => c.id === category.id)) throw new ModelError('DUPLICATE_ID');
  const clean = { id: category.id, name: mdlCategoryName(category.name) };
  return { ...model, updatedAt: now, categories: [...model.categories, clean] };
}

function renameCategory(model, id, name, opts) {
  const now = mdlNow(opts);
  const clean = mdlCategoryName(name);
  if (!model.categories.some((c) => c.id === id)) throw new ModelError('NOT_FOUND');
  return { ...model, updatedAt: now, categories: model.categories.map((c) => (c.id === id ? { id, name: clean } : c)) };
}

/** Deleting a category never deletes items: they fall back to no category. */
function deleteCategory(model, id, opts) {
  const now = mdlNow(opts);
  if (!model.categories.some((c) => c.id === id)) throw new ModelError('NOT_FOUND');
  return {
    ...model,
    updatedAt: now,
    categories: model.categories.filter((c) => c.id !== id),
    items: model.items.map((i) => (i.categoryId === id ? { ...i, categoryId: null, updatedAt: now } : i)),
  };
}

/** Lower-case, strip combining marks (Vietnamese accents) and fold the D-stroke. Han text is untouched. */
function foldSearchText(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd');
}

/**
 * Case- and accent-insensitive search; every whitespace-separated token must match.
 * Looks only at title, username, domain, category name and notes. Passwords and custom field values are never read.
 */
function searchItems(model, query) {
  const tokens = foldSearchText(query).split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return model.items.slice();
  const catName = new Map(model.categories.map((c) => [c.id, c.name]));
  return model.items.filter((it) => {
    const hay = [it.title, it.username, it.domain, it.categoryId ? catName.get(it.categoryId) || '' : '', it.notes].map(foldSearchText).join('\n');
    return tokens.every((t) => hay.includes(t));
  });
}

/**
 * Merge only, never overwrite or delete (plan 5g).
 * Backup/import: same id and identical content -> skipped; same id, different content -> new copy with a new id
 * and `conflictSuffix` on the title (counted in conflicts, not in added); otherwise added.
 * Share: every item gets a new id.
 * @returns {{model: object, stats: {added: number, skipped: number, conflicts: number}}}
 */
function mergeIntoModel(model, incoming, opts) {
  const o = opts || {};
  const now = mdlNow(o);
  if (typeof o.newId !== 'function') throw new ModelError('BAD_INPUT');
  const isShare = o.isShare === true;
  const suffix = typeof o.conflictSuffix === 'string' ? o.conflictSuffix : ' (imported)';
  const inc = sanitizeModel(incoming);
  const stats = { added: 0, skipped: 0, conflicts: 0 };
  const categories = model.categories.slice();
  const catMap = new Map();
  const fresh = () => {
    const id = o.newId();
    if (!mdlValidId(id)) throw new ModelError('BAD_INPUT');
    return id;
  };

  const mapCategory = (cid) => {
    if (cid === null) return null;
    if (catMap.has(cid)) return catMap.get(cid);
    const src = inc.categories.find((c) => c.id === cid);
    let target = null;
    if (!isShare && categories.some((c) => c.id === cid)) {
      target = cid;
    } else {
      const folded = foldSearchText(src.name);
      const byName = categories.find((c) => foldSearchText(c.name) === folded);
      if (byName) {
        target = byName.id;
      } else {
        if (categories.length >= MODEL_LIMITS.categories) throw new ModelError('CATEGORIES_MAX');
        target = isShare || categories.some((c) => c.id === cid) ? fresh() : cid;
        categories.push({ id: target, name: src.name });
      }
    }
    catMap.set(cid, target);
    return target;
  };

  const byId = new Map(model.items.map((i) => [i.id, i]));
  const newItems = [];
  const known = mdlCatIds(model);
  for (const it of inc.items) {
    if (isShare) {
      newItems.push({ ...it, id: fresh(), categoryId: mapCategory(it.categoryId) });
      stats.added += 1;
      continue;
    }
    const existing = byId.get(it.id);
    if (!existing) {
      newItems.push({ ...it, categoryId: mapCategory(it.categoryId) });
      stats.added += 1;
    } else if (JSON.stringify(mdlItem(existing, known, false)) === JSON.stringify(mdlItem(it, known, false))) {
      stats.skipped += 1;
    } else {
      const title = it.title + suffix;
      if (title.length > MODEL_LIMITS.title) throw new ModelError('TITLE_TOO_LONG');
      newItems.push({ ...it, id: fresh(), title, categoryId: mapCategory(it.categoryId) });
      stats.conflicts += 1;
    }
  }
  if (model.items.length + newItems.length > MODEL_LIMITS.items) throw new ModelError('ITEMS_MAX');

  const changed = newItems.length > 0;
  const merged = changed
    ? { ...model, updatedAt: now, categories, items: [...model.items, ...newItems] }
    : model;
  mdlNormalize(merged, true);
  return { model: merged, stats };
}

// ===== src/strength.js =====
// Password strength estimate (plan section 6): the cheapest way to "spell" the password as a chain of
// segments wins. Segments are repeats, character runs, keyboard rows, dates and years, and words from a
// built-in list (Vietnamese included), with a charge for capitals and look-alike digits; any other
// character costs log2 of the character-set size. The result is an estimate in bits, never a guarantee.
// It does not depend on the UI language.


const STR_THRESHOLDS = Object.freeze([28, 40, 60, 80]);

const STR_MAX_ANALYSED = 1024; // characters beyond this are charged as plain random characters
const STR_RANK = new Map();
STR_WORDS.forEach((w, i) => { if (!STR_RANK.has(w)) STR_RANK.set(w, i + 1); });
let strLongest = 0;
for (const w of STR_WORDS) if (w.length > strLongest) strLongest = w.length;

const STR_LEET = { '@': 'a', '4': 'a', '8': 'b', '3': 'e', '1': 'i', '!': 'i', '0': 'o', '5': 's', '$': 's', '7': 't', '+': 't', '2': 'z' };
const STR_ROWS = [
  '1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm', '!@#$%^&*()',
  '1qaz', '2wsx', '3edc', '4rfv', '5tgb', '6yhn', '7ujm', '8ik,', 'zaq1', 'xsw2', 'cde3', 'vfr4', 'bgt5', 'nhy6', 'mju7',
].flatMap((r) => [r, [...r].reverse().join('')]);
const STR_YEAR = /^(?:19|20)\d\d/;
const STR_DATE = /^(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])(?:19|20)\d\d/;

/** 1 = very weak ... 5 = very strong, using the plan thresholds (<28, <40, <60, <80, >=80 bits). */
function strengthLevel(bits) {
  let level = 1;
  for (const limit of STR_THRESHOLDS) if (bits >= limit) level += 1;
  return level;
}

function strCharset(chars) {
  let lower = false;
  let upper = false;
  let digit = false;
  let symbol = false;
  let other = false;
  for (const c of chars) {
    if (c >= 'a' && c <= 'z') lower = true;
    else if (c >= 'A' && c <= 'Z') upper = true;
    else if (c >= '0' && c <= '9') digit = true;
    else if (c.charCodeAt(0) < 128) symbol = true;
    else other = true;
  }
  const size = (lower ? 26 : 0) + (upper ? 26 : 0) + (digit ? 10 : 0) + (symbol ? 33 : 0) + (other ? 100 : 0);
  return Math.max(size, 2);
}

function strClass(c) {
  if (c >= '0' && c <= '9') return 10;
  if (c >= 'a' && c <= 'z') return 26;
  if (c >= 'A' && c <= 'Z') return 26;
  return 0;
}

/** Calls edge(end, bits) for every cheap segment that starts at index i. */
function strEdges(chars, lower, i, n, brute, edge) {
  // Dictionary words, with capitals and look-alike digits charged.
  const maxLen = Math.min(strLongest, n - i);
  for (let len = 3; len <= maxLen; len += 1) {
    const raw = chars.slice(i, i + len).join('');
    const low = lower.slice(i, i + len).join('');
    let rank = STR_RANK.get(low);
    let extra = 0;
    if (rank === undefined) {
      const plain = [...low].map((c) => STR_LEET[c] || c).join('');
      rank = plain !== low ? STR_RANK.get(plain) : undefined;
      if (rank === undefined) continue;
      extra += 2;
    }
    if (raw !== low) extra += raw === raw.toUpperCase() ? 1 : (raw.slice(1) === low.slice(1) ? 1 : 2);
    edge(i + len, Math.log2(rank + 1) + 1 + extra);
  }
  // Runs where each character is the previous one plus or minus one (abc, 987, XYZ).
  const klass = strClass(chars[i]);
  if (klass > 0 && i + 2 < n) {
    const delta = chars[i + 1].charCodeAt(0) - chars[i].charCodeAt(0);
    if (Math.abs(delta) === 1) {
      let end = i + 1;
      while (end + 1 < n && chars[end + 1].charCodeAt(0) - chars[end].charCodeAt(0) === delta && strClass(chars[end + 1]) === klass) end += 1;
      for (let last = i + 2; last <= end; last += 1) edge(last + 1, Math.log2(klass) + Math.log2(last - i + 1) + 1);
    }
  }
  // Keyboard rows and columns, forwards and backwards.
  for (const row of STR_ROWS) {
    let at = row.indexOf(lower[i]);
    while (at !== -1) {
      let len = 1;
      while (i + len < n && at + len < row.length && lower[i + len] === row[at + len]) len += 1;
      for (let k = 4; k <= len; k += 1) edge(i + k, Math.log2(30) + Math.log2(k) + 1);
      at = row.indexOf(lower[i], at + 1);
    }
  }
  // Repeats of a block of 1 to 8 characters (aaaa, abab, xyzxyz).
  for (let size = 1; size <= 8 && i + 2 * size <= n; size += 1) {
    let reps = 1;
    while (i + (reps + 1) * size <= n) {
      let same = true;
      for (let k = 0; k < size; k += 1) if (chars[i + k] !== chars[i + reps * size + k]) { same = false; break; }
      if (!same) break;
      reps += 1;
    }
    if (reps >= 2) edge(i + reps * size, size * brute + Math.log2(reps) + 1);
  }
  // Dates and years written as digits.
  const rest = chars.slice(i, i + 8).join('');
  if (STR_DATE.test(rest)) edge(i + 8, 16);
  if (STR_YEAR.test(rest)) edge(i + 4, 7.6);
}

/**
 * @param {string} str any string; it is measured after NFC normalization
 * @returns {{bits: number, level: 1|2|3|4|5}}
 */
function estimateStrength(str) {
  if (typeof str !== 'string') throw new TypeError('estimateStrength expects a string');
  const all = Array.from(str.normalize('NFC'));
  const n = Math.min(all.length, STR_MAX_ANALYSED);
  const chars = all.slice(0, n);
  const lower = chars.map((c) => c.toLowerCase());
  const brute = Math.log2(strCharset(all));
  const cost = new Array(n + 1).fill(Infinity);
  cost[0] = 0;
  for (let i = 0; i < n; i += 1) {
    const here = cost[i];
    const relax = (end, bits) => { if (here + bits < cost[end]) cost[end] = here + bits; };
    relax(i + 1, brute);
    strEdges(chars, lower, i, n, brute, relax);
  }
  const bits = Math.round((cost[n] + (all.length - n) * brute) * 10) / 10;
  return { bits, level: strengthLevel(bits) };
}

// ===== src/generator.js =====
// Password generator (plan section 6): getRandomValues + rejection sampling, length 8..128 (default 20).
// A password that lacks any selected group is discarded as a whole and drawn again, which keeps the
// result uniform over all passwords that contain every selected group.

const GEN_SETS = Object.freeze({
  lower: 'abcdefghijklmnopqrstuvwxyz',
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  digits: '0123456789',
  symbols: '!@#$%^&*()-_=+[]{};:,.?/',
});

const GEN_MIN_LENGTH = 8;
const GEN_MAX_LENGTH = 128;
const GEN_DEFAULT_LENGTH = 20;

const GEN_GROUPS = ['lower', 'upper', 'digits', 'symbols'];
const GEN_BATCH = 64;

function genPlatformRandom(arr) {
  return globalThis.crypto.getRandomValues(arr);
}

/**
 * @param {{length?: number, lower?: boolean, upper?: boolean, digits?: boolean, symbols?: boolean, random?: (a: Uint32Array) => Uint32Array}} [opts]
 *   random: source that fills a Uint32Array (tests only; defaults to crypto.getRandomValues).
 * @returns {string}
 */
function generatePassword(opts) {
  const o = opts || {};
  const length = o.length === undefined ? GEN_DEFAULT_LENGTH : o.length;
  if (!Number.isInteger(length) || length < GEN_MIN_LENGTH || length > GEN_MAX_LENGTH) {
    throw new RangeError(`Password length must be an integer from ${GEN_MIN_LENGTH} to ${GEN_MAX_LENGTH}`);
  }
  const chosen = GEN_GROUPS.filter((g) => (o[g] === undefined ? true : o[g] === true));
  if (chosen.length === 0) throw new RangeError('At least one character group must be selected');
  const charset = chosen.map((g) => GEN_SETS[g]).join('');
  const n = charset.length;
  const limit = Math.floor(0x100000000 / n) * n; // values at or above this would favour the low symbols
  const random = typeof o.random === 'function' ? o.random : genPlatformRandom;
  const pool = new Uint32Array(GEN_BATCH);
  let have = 0;

  const nextIndex = () => {
    for (;;) {
      if (have === 0) {
        random(pool);
        have = GEN_BATCH;
      }
      const v = pool[GEN_BATCH - have];
      have -= 1;
      if (v < limit) return v % n;
    }
  };

  for (;;) {
    let out = '';
    for (let i = 0; i < length; i += 1) out += charset[nextIndex()];
    if (chosen.every((g) => [...out].some((c) => GEN_SETS[g].includes(c)))) return out;
  }
}

// Static product configuration. No secrets, nothing user-specific.
const APP_NAME = 'Vault V2';
const APP_VERSION = '0.0.1';

// Fixed suffix keeps this app's storage apart from other apps on the same origin (plan 5c).
const DB_NAME = 'vault-v2-a7f3c91e';

const SUPPORTED_LANGS = ['vi', 'en', 'zh-CN'];

// PBKDF2-SHA256 work factor for new vaults and files (plan section 2).
