// ===== src/backup.js =====
// Backup module (plan sections 3, 5b, 5f, 5g): reading and opening .vault files, the import preview, share files,
// the master / share password bar, backup reminders, and the transfer state that outlives a lock
// (a chosen file, a prepared share file, an export waiting for its "saved" confirmation).
// Nothing here ever sees the vault key: files are opened with a key derived from the FILE password.








const TRANSFER_HOLD_MS = 5 * 60 * 1000; // a chosen file / a prepared share file is dropped after this
const BLOB_REVOKE_MS = 60 * 1000; // a download URL lives this long
const BK_MIN_CHARS = 12; // plan 5f
const BK_MIN_BITS = 60;
const BK_MAX_CHARS = 1024;
const BK_DAY_MS = 24 * 3600 * 1000;
const BK_REVS = 20;

// One message for a wrong password and for a damaged file, on purpose (plan 3).
const BK_GENERIC = 'Wrong password, or the file is damaged or was modified';
const BK_MESSAGES = Object.freeze({
  BAD_INPUT: 'Invalid input',
  FILE_TOO_LARGE: 'File is too large',
  READ_FAILED: 'The file could not be read',
  BAD_FILE: BK_GENERIC,
  WRONG_PASSWORD: BK_GENERIC,
  BAD_DATA: BK_GENERIC,
  NOTHING_SELECTED: 'No item is selected',
  BAD_SECRET: 'The password is too short or too weak',
});

class BackupError extends Error {
  constructor(code) {
    super(BK_MESSAGES[code] || BK_MESSAGES.BAD_INPUT);
    this.name = 'BackupError';
    this.code = BK_MESSAGES[code] ? code : 'BAD_INPUT';
  }
}

const bkTypes = (context) => (context === 'restore' ? [CONTAINER_TYPE.BACKUP] : [CONTAINER_TYPE.BACKUP, CONTAINER_TYPE.SHARE]);

/** Maps the container layer's failures: oversize stays itself, everything else is the one generic file failure. */
function bkParse(bytes, allowedTypes) {
  try {
    return parseContainer(bytes, { allowedTypes });
  } catch (e) {
    throw new BackupError(e instanceof ContainerError && e.code === 'FILE_TOO_LARGE' ? 'FILE_TOO_LARGE' : 'BAD_FILE');
  }
}

/** The size is checked before the content is read (plan 3). A File object, or anything with size and arrayBuffer(). */
const readPickedFile = async (file) => {
  if (!file || typeof file.size !== 'number' || typeof file.arrayBuffer !== 'function') throw new BackupError('BAD_INPUT');
  if (file.size > MAX_FILE_BYTES) throw new BackupError('FILE_TOO_LARGE');
  let buf;
  try {
    buf = await file.arrayBuffer();
  } catch {
    throw new BackupError('READ_FAILED');
  }
  if (buf.byteLength > MAX_FILE_BYTES) throw new BackupError('FILE_TOO_LARGE');
  return new Uint8Array(buf);
};

/**
 * Header checks first (size, magic, version, ids, iterations, length, type for this context), then the key from the file
 * password, then decryption and the allowlist copy of the content. context: 'import' (BACKUP, SHARE) or 'restore' (BACKUP).
 * @returns {Promise<{model: object, info: {type: number, rev: number, createdAt: number, vaultId: Uint8Array}}>}
 */
const openBackupFile = async (bytes, password, context) => {
  const parsed = bkParse(bytes, bkTypes(context));
  let secret;
  try {
    secret = normalizeSecret(password);
  } catch {
    throw new BackupError('WRONG_PASSWORD');
  }
  const key = await deriveVaultKey(secret, parsed.salt, parsed.iterations);
  let plain;
  try {
    plain = await decryptContainer(key, parsed);
  } catch {
    throw new BackupError('WRONG_PASSWORD');
  }
  try {
    return { model: parseModel(plain), info: { type: parsed.type, rev: parsed.rev, createdAt: parsed.createdAt, vaultId: parsed.vaultId } };
  } catch {
    throw new BackupError('BAD_DATA');
  } finally {
    wipeBytes(plain);
  }
};

/**
 * What an import would do to the current model. count is the number of items the button promises:
 * new items plus the "(imported)" copies of changed ones. Merge only: nothing is overwritten or deleted.
 * @returns {{stats: {added: number, skipped: number, conflicts: number}, count: number, merged: object, mayRestoreDeleted: boolean}}
 */
function previewImport(current, incoming, info, opts) {
  const isShare = info.type === CONTAINER_TYPE.SHARE;
  const { model, stats } = mergeIntoModel(current, incoming, { now: opts.now, newId: opts.newId, isShare, conflictSuffix: opts.conflictSuffix });
  const count = stats.added + stats.conflicts;
  return { stats, count, merged: model, mayRestoreDeleted: !isShare && count > 0 };
}

/** Master / share password bar: at least 12 characters (after NFC) and about 60 bits; over 1024 characters is its own problem. */
function meetsSecretBar(str) {
  if (typeof str !== 'string' || str.length === 0) return { ok: false, chars: 0, bits: 0, level: 1, tooLong: false };
  const chars = [...str.normalize('NFC')].length;
  const { bits, level } = estimateStrength(str);
  const tooLong = chars > BK_MAX_CHARS;
  return { ok: !tooLong && chars >= BK_MIN_CHARS && bits >= BK_MIN_BITS, chars, bits, level, tooLong };
}

function generateSharePassword() {
  for (let i = 0; i < 50; i += 1) {
    const pw = generatePassword({ length: 20, lower: true, upper: true, digits: true, symbols: true });
    if (meetsSecretBar(pw).ok) return pw;
  }
  throw new BackupError('BAD_SECRET');
}

/**
 * A share file: only the chosen items (and the categories they use), a new salt, a random vault id, rev 0,
 * created-at 0, no draft, no settings of the source. The password is used once and not kept.
 * @returns {Promise<{bytes: Uint8Array, count: number}>}
 */
const createShareFile = async ({ model, itemIds, password }) => {
  const chosen = new Set(Array.isArray(itemIds) ? itemIds : []);
  const items = model.items.filter((i) => chosen.has(i.id)).map((i) => ({ ...i, customFields: i.customFields.map((f) => ({ ...f })) }));
  if (items.length === 0) throw new BackupError('NOTHING_SELECTED');
  if (!meetsSecretBar(password).ok) throw new BackupError('BAD_SECRET');
  const used = new Set(items.map((i) => i.categoryId).filter(Boolean));
  const categories = model.categories.filter((c) => used.has(c.id));
  const payload = { ...createEmptyModel({ now: 0, categories }), items };
  const plaintext = serializeModel(payload);
  let secret;
  try {
    secret = normalizeSecret(password);
  } catch {
    throw new BackupError('BAD_SECRET');
  }
  const salt = randomBytes(16);
  const key = await deriveVaultKey(secret, salt, KDF_ITERATIONS);
  try {
    const bytes = await encryptContainer(key, { type: CONTAINER_TYPE.SHARE, iterations: KDF_ITERATIONS, salt, vaultId: randomBytes(16), rev: 0, createdAt: 0, plaintext });
    return { bytes, count: items.length };
  } finally {
    wipeBytes(plaintext);
  }
};

const bkPad = (n) => String(n).padStart(2, '0');

/** vault-YYYY-MM-DD.vault (local date); kind 'share' gives vault-share-YYYY-MM-DD.vault. */
function backupFileName(ms, kind) {
  const d = new Date(ms);
  return 'vault-' + (kind === 'share' ? 'share-' : '') + d.getFullYear() + '-' + bkPad(d.getMonth() + 1) + '-' + bkPad(d.getDate()) + '.vault';
}

/**
 * Why a backup reminder should show now (plan 5g), or null. Order: master changed, never backed up, 20 revisions, age.
 * `rev - lastRev` counts the confirmation commit that stores lastRev (one revision of metadata only), hence "> 1" for "has changes".
 */
function backupReminder({ backup, rev, itemCount, now, masterChanged, maxAgeDays }) {
  if (masterChanged) return 'master';
  if (backup.lastAt === 0) return itemCount >= 1 ? 'never' : null;
  if (rev - backup.lastRev >= BK_REVS) return 'revs';
  if (rev - backup.lastRev > 1 && now - backup.lastAt > maxAgeDays * BK_DAY_MS) return 'age';
  return null;
}

/** Safari on iOS / iPadOS in a normal tab (not added to the home screen): its storage is evicted sooner (plan 5g). */
function isIosBrowserTab({ userAgent, platform, maxTouchPoints, standalone }) {
  const iosPhone = /iPhone|iPad|iPod/.test(userAgent || '') || /iPhone|iPad|iPod/.test(platform || '');
  const ipadAsMac = platform === 'MacIntel' && maxTouchPoints > 1;
  return (iosPhone || ipadAsMac) && standalone !== true;
}

/**
 * State that belongs to the page, not to the vault session, so a lock does not erase it (plan 2, 5b).
 * Nothing here is secret: a File (ciphertext), a prepared share file (ciphertext), a revision number.
 * env: {now, setTimer, clearTimer, createUrl(blob), revokeUrl(url), clickDownload(url, name)}
 */
function createTransferState(env) {
  const listeners = new Set();
  let pending = null;
  let pendingTimer = null;
  let share = null;
  let shareTimer = null;
  let exportPending = null;
  let exportAsk = false;
  let masterChanged = false;
  const notify = () => { for (const cb of [...listeners]) { try { cb(); } catch { /* a listener must not break the state */ } } };
  const drop = (timer) => { if (timer !== null) env.clearTimer(timer); return null; };

  return {
    onChange(cb) {
      listeners.add(cb);
      return () => { listeners.delete(cb); };
    },

    setPendingFile(file, purpose) {
      pendingTimer = drop(pendingTimer);
      pending = { file, name: String(file.name), size: file.size, purpose, expiresAt: env.now() + TRANSFER_HOLD_MS };
      pendingTimer = env.setTimer(() => { pendingTimer = null; pending = null; notify(); }, TRANSFER_HOLD_MS);
      notify();
    },
    getPendingFile: () => pending,
    clearPendingFile() {
      pendingTimer = drop(pendingTimer);
      if (pending) { pending = null; notify(); }
    },

    /** entry: {bytes, name, count}. The password is deliberately not part of it. */
    setShareReady(entry) {
      shareTimer = drop(shareTimer);
      share = { bytes: entry.bytes, name: entry.name, count: entry.count, expiresAt: env.now() + TRANSFER_HOLD_MS };
      shareTimer = env.setTimer(() => { shareTimer = null; share = null; notify(); }, TRANSFER_HOLD_MS);
      notify();
    },
    getShareReady: () => share,
    clearShareReady() {
      shareTimer = drop(shareTimer);
      if (share) { share = null; notify(); }
    },

    /** An export was downloaded; waits for the person to confirm "saved". No timeout: the person decides. */
    setExportPending(entry) {
      exportPending = { rev: entry.rev, name: entry.name };
      notify();
    },
    getExportPending: () => exportPending,
    clearExportPending() {
      exportAsk = false;
      if (exportPending) { exportPending = null; notify(); }
    },
    /** A lock came while the confirmation was on screen: ask once more after the next unlock. */
    markExportAsk() { exportAsk = exportPending !== null; },
    takeExportAsk() {
      const v = exportAsk && exportPending !== null;
      exportAsk = false;
      return v;
    },

    isMasterChanged: () => masterChanged,
    setMasterChanged(flag) {
      if (masterChanged !== flag) { masterChanged = flag; notify(); }
    },

    /** Blob -> temporary link -> click. The URL is revoked after 60 s; nothing else (a lock, a clear) revokes it. */
    download(bytes, name) {
      const url = env.createUrl(new Blob([bytes], { type: 'application/octet-stream' }));
      env.clickDownload(url, name);
      env.setTimer(() => { env.revokeUrl(url); }, BLOB_REVOKE_MS);
    },
  };
}

// ===== src/domain.js =====
// Website address helpers and the monogram badge (plan 5e after the "no web logos" decision).
// Everything here is local string work: no request is ever made, nothing is sent anywhere.

// Host name endings that mean "not a public site"; such hosts get no display name.
const DN_INTERNAL_SUFFIXES = ['local', 'localdomain', 'localhost', 'internal', 'intranet', 'lan', 'home', 'corp', 'private', 'test', 'invalid', 'example', 'arpa'];
const DN_SCHEME = /^[a-z][a-z0-9+.-]*:(?!\d)/i; // "scheme:" but not "host:8080"
const DN_BAD_CHARS = /[\s\u0000-\u001f\u007f]/;
const DN_LABEL = /^[a-z0-9_](?:[a-z0-9_-]*[a-z0-9_])?$/;
const DN_VISIBLE = /[\p{L}\p{N}\p{Extended_Pictographic}\p{Regional_Indicator}]/u;
const DN_SEGMENTER = typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function' ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;

function dnGraphemes(text) {
  if (DN_SEGMENTER) return Array.from(DN_SEGMENTER.segment(text), (part) => part.segment);
  return Array.from(text);
}

/**
 * Turns what the user typed into a full web address. '' stays '' and null means "not an http or https address".
 * A bare host such as "example.com/login" gets https in front; any other scheme is returned as typed
 * (and therefore refused) so that script-like addresses can never slip through.
 */
function normalizeWebUrl(raw) {
  const typed = String(raw).trim();
  if (typed === '') return '';
  let full = typed;
  if (!/^https?:\/\//i.test(typed)) full = DN_SCHEME.test(typed) ? typed : 'https://' + typed;
  if (DN_BAD_CHARS.test(full)) return null;
  let parsed;
  try {
    parsed = new URL(full);
  } catch {
    return null;
  }
  return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? full : null;
}

/** Display host of an address: lower-case, no port, path, user info, final dot or leading "www."; '' when it is not a public name. */
function domainFromUrl(raw) {
  const full = normalizeWebUrl(raw);
  if (full === null || full === '') return '';
  let host = new URL(full).hostname.toLowerCase();
  if (host.endsWith('.')) host = host.slice(0, -1);
  if (host === '' || host.length > 253 || host.includes(':') || host.includes('[')) return ''; // IPv6
  if (host.startsWith('www.') && host.indexOf('.', 4) > 0) host = host.slice(4);
  const labels = host.split('.');
  if (labels.length < 2) return ''; // single label: an intranet name
  if (!labels.every((label) => DN_LABEL.test(label))) return '';
  if (/^\d+$/.test(labels[labels.length - 1])) return ''; // IPv4 and numeric hosts
  if (DN_INTERNAL_SUFFIXES.includes(labels[labels.length - 1])) return '';
  return host;
}

function dnUpper(grapheme) {
  const up = grapheme.toLocaleUpperCase();
  return dnGraphemes(up).length === 1 ? up : grapheme; // "ss" for the sharp s would be two letters
}

/** The first letter (one grapheme: accented letter, Han character, emoji, flag or ZWJ sequence) of a title. */
function monogramOf(title) {
  const text = String(title).normalize('NFC');
  const parts = dnGraphemes(text);
  for (const part of parts) if (DN_VISIBLE.test(part)) return dnUpper(part);
  for (const part of parts) if (part.trim() !== '') return part;
  return '#';
}

/** m1..m4, a stable colour class chosen from the title (FNV-1a over the NFC lower-case text). */
function monogramClass(title) {
  const text = String(title).normalize('NFC').trim().toLowerCase();
  let hash = 2166136261;
  for (let i = 0; i < text.length; i += 1) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  return 'm' + ((hash % 4) + 1);
}

// ===== src/migrate/map.js =====
// Old account -> V2 item (docs/handoff.md decision 3). Every string ends up in a V2 model through sanitizeModel.




const NO_NAME_TITLE = '(no name)';

const mgText = (v) => (v === undefined || v === null ? '' : String(v));
const mgAppend = (notes, line) => (notes === '' ? line : notes + '\n' + line);

/** @returns {{title:string, username:string, password:string, url:string, notes:string, categoryName:string|null}} */
function mapAccount(row, password, notes) {
  const name = mgText(row.service_name);
  let noteText = mgText(notes);
  const rawUrl = mgText(row.url);
  let url = '';
  if (rawUrl.trim() !== '') {
    const full = normalizeWebUrl(rawUrl);
    if (full === null || full.length > MODEL_LIMITS.url) noteText = mgAppend(noteText, 'URL: ' + rawUrl);
    else url = full;
  }
  const type = mgText(row.type).trim();
  let categoryName = null;
  if (type !== '') {
    if (type.length > MODEL_LIMITS.categoryName) noteText = mgAppend(noteText, 'Type: ' + type);
    else categoryName = type;
  }
  return { title: name.trim() === '' ? NO_NAME_TITLE : name, username: mgText(row.username), password: mgText(password), url, notes: noteText, categoryName };
}

/**
 * entries: [{row, password, notes}] (decrypted). Returns a V2 model, or throws BAD_MODEL with the number of items V2 refuses.
 * @param {{now:number, newId:()=>string}} opts
 */
function buildMigrationModel(entries, opts) {
  const categories = [];
  const byName = new Map();
  const items = entries.map((e) => {
    const m = mapAccount(e.row, e.password, e.notes);
    let categoryId = null;
    if (m.categoryName !== null) {
      const k = m.categoryName.normalize('NFC').toLowerCase();
      if (!byName.has(k)) {
        const cat = { id: opts.newId(), name: m.categoryName };
        byName.set(k, cat.id);
        categories.push(cat);
      }
      categoryId = byName.get(k);
    }
    return {
      id: opts.newId(), title: m.title, username: m.username, password: m.password, url: m.url, domain: '', categoryId, favorite: false,
      notes: m.notes, customFields: [], createdAt: opts.now, updatedAt: opts.now, passwordChangedAt: opts.now,
    };
  });
  const base = createEmptyModel({ now: opts.now, categories });
  const bad = items.filter((it) => {
    try {
      sanitizeModel({ ...base, items: [it] });
      return false;
    } catch (e) {
      if (e instanceof ModelError) return true;
      throw e;
    }
  }).length;
  if (bad > 0) throw new MigrateError('BAD_MODEL', bad);
  try {
    return sanitizeModel({ ...base, items });
  } catch (e) {
    if (e instanceof ModelError) throw new MigrateError('BAD_MODEL', items.length);
    throw e;
  }
}

// ===== src/migrate/run.js =====
// The migration itself: unlock locally, sign in with the old protocol, read and decrypt every record, check, build the V2 file.






/** 22 characters of base64url: a valid V2 id. */
function newMigrationId() {
  return toBase64(randomBytes(16)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

const mgHasError = (v) => typeof v === 'object' && v !== null && Object.prototype.hasOwnProperty.call(v, 'error');
const mgIsText = (v) => typeof v === 'string';

async function mgOpenSession(client, master) {
  const ch = await client.get({ action: 'getSessionChallenge' });
  if (mgHasError(ch)) throw new MigrateError('SERVER');
  if (!ch || typeof ch.challenge !== 'string' || ch.challenge === '') throw new MigrateError('SESSION');
  const proof = await bootstrapProof(master);
  const res = await client.post({ action: 'createSession', proofType: 'password', proof, challenge: ch.challenge, response: await sessionResponse(proof, ch.challenge) });
  if (mgHasError(res) || !res || typeof res.sessionToken !== 'string' || res.sessionToken === '') throw new MigrateError('SESSION');
  return res.sessionToken;
}

const MG_NAME_MAX = 100;

/** Service name of a skipped item, as plain text for the screen: never empty, never long. */
function mgSkippedName(v) {
  const t = typeof v === 'string' ? v.trim() : '';
  return t === '' ? '(no name)' : t.slice(0, MG_NAME_MAX);
}

/**
 * @param {{client:object, metaText:string|null, master:string, now:number, newId?:()=>string, signal?:AbortSignal, onProgress?:(done:number,total:number)=>void}} o
 * v3 records that this browser's vault key cannot open belong to another device: those items are skipped and listed, the rest
 * is migrated. A damaged v2 record (the master is right) or a CryptoJS record still stops the run.
 * @returns {Promise<{model:object, count:number, total:number, skipped:string[], v2Count:number, emptyItems:string[]}>}
 */
const runMigration = async (o) => {
  const meta = parseLegacyMeta(o.metaText);
  const raw = await unwrapVaultKey(meta, o.master); // a wrong master stops here, before any request
  const reader = createRecordReader(raw, o.master);
  const newId = o.newId || newMigrationId;
  const aborted = () => { if (o.signal && o.signal.aborted) throw new MigrateError('ABORTED'); };
  try {
    aborted();
    const token = await mgOpenSession(o.client, o.master);
    try {
      aborted();
      const rows = await o.client.get({ action: 'getAccounts', _session: token });
      if (!Array.isArray(rows) || mgHasError(rows)) throw new MigrateError('SERVER');
      if (rows.length === 0) throw new MigrateError('NO_ACCOUNTS');
      const entries = [];
      const skipped = [];
      const emptyItems = [];
      let legacy = 0;
      let failed = 0;
      let v2Count = 0;
      for (let i = 0; i < rows.length; i += 1) {
        aborted();
        const row = rows[i];
        if (typeof row !== 'object' || row === null || typeof row.id !== 'string' || row.id === '') throw new MigrateError('SERVER');
        const rec = await o.client.get({ action: 'getCiphertext', id: row.id, _session: token });
        // An error answer (HTTP 200 with an "error" key), a missing password field or a non-text field is a server problem,
        // never an empty record: the person would get an item without its password.
        if (typeof rec !== 'object' || rec === null || Array.isArray(rec) || mgHasError(rec)) throw new MigrateError('SERVER');
        if (!mgIsText(rec.password_encrypted) || !(rec.notes_encrypted === undefined || rec.notes_encrypted === null || mgIsText(rec.notes_encrypted))) throw new MigrateError('SERVER');
        const kinds = [recordKind(rec.password_encrypted), recordKind(rec.notes_encrypted)];
        try {
          const password = await reader.read(rec.password_encrypted);
          const notes = await reader.read(rec.notes_encrypted);
          entries.push({ row, password, notes });
          if (kinds.includes('v2')) v2Count += 1;
          if (password === '' && notes === '') emptyItems.push(mgSkippedName(row.service_name));
        } catch (e) {
          if (!(e instanceof MigrateError)) throw e;
          if (e.code === 'LEGACY_RECORD') legacy += 1;
          else if (kinds.includes('v2')) failed += 1; // right master but a damaged v2 record: not a device difference
          else skipped.push(mgSkippedName(row.service_name));
        }
        if (o.onProgress) o.onProgress(i + 1, rows.length);
      }
      if (legacy > 0) throw new MigrateError('LEGACY_RECORD', legacy);
      if (failed > 0) throw new MigrateError('DECRYPT_FAILED', failed);
      if (entries.length === 0) throw new MigrateError('NONE_DECRYPTED', skipped.length);
      const model = buildMigrationModel(entries, { now: o.now, newId });
      if (model.items.length !== entries.length || entries.length + skipped.length !== rows.length) throw new MigrateError('COUNT_MISMATCH', rows.length - model.items.length);
      return { model, count: model.items.length, total: rows.length, skipped, v2Count, emptyItems };
    } finally {
      try {
        await o.client.post({ action: 'logout', _session: token });
      } catch {
        /* the session ends by itself on the server; nothing to report */
      }
    }
  } finally {
    raw.fill(0);
  }
};

/**
 * Makes the SHARE file with V2's own code and opens it again with the transfer password to check the count.
 * @returns {Promise<{bytes:Uint8Array, count:number}>}
 */
const createMigrationFile = async ({ model, password }) => {
  if (!meetsSecretBar(password).ok) throw new MigrateError('BAD_SECRET');
  let made;
  try {
    made = await createShareFile({ model, itemIds: model.items.map((i) => i.id), password });
    const back = await openBackupFile(made.bytes, password, 'import');
    if (back.model.items.length !== model.items.length || made.count !== model.items.length) throw new MigrateError('COUNT_MISMATCH');
  } catch (e) {
    if (e instanceof MigrateError) throw e;
    if (e instanceof BackupError && e.code === 'BAD_SECRET') throw new MigrateError('BAD_SECRET');
    throw new MigrateError('BAD_MODEL');
  }
  return made;
};

const mgPad = (n) => String(n).padStart(2, '0');

/** myvault-to-v2-YYYYMMDD.vault (local date); -partial before the extension when some items were left out */
function migrationFileName(ms, { partial = false } = {}) {
  const d = new Date(ms);
  return 'myvault-to-v2-' + d.getFullYear() + mgPad(d.getMonth() + 1) + mgPad(d.getDate()) + (partial ? '-partial' : '') + '.vault';
}

// ===== src/migrate/main.js =====
// Entry of the one-time migration page: builds the screen, runs the migration, offers the file.
// All text goes in through textContent. Secrets (old master, transfer password, decrypted data) are dropped as soon as
// the file exists, when something fails, and when the page is hidden.








let pgLang = 'en';
const pgBound = new Map(); // element -> {key, params}: texts that follow the language

function pgText(key, params) {
  let s = MG_TEXTS[pgLang][key] || key;
  if (params) for (const k of Object.keys(params)) s = s.split('{' + k + '}').join(String(params[k]));
  return s;
}

function pgSet(node, key, params) {
  pgBound.set(node, { key, params });
  node.textContent = pgText(key, params);
}

function pgRefresh() {
  for (const [node, spec] of pgBound) node.textContent = pgText(spec.key, spec.params);
  document.documentElement.setAttribute('lang', pgLang);
}

function pgEl(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) node.setAttribute(k, attrs[k]);
  for (const kid of kids) if (kid) node.appendChild(kid);
  return node;
}

function pgField(id, labelKey, type, autocomplete) {
  const label = pgEl('label', { for: id });
  pgSet(label, labelKey);
  const input = pgEl('input', { id, name: id, type, autocomplete: autocomplete || 'off', autocapitalize: 'off', spellcheck: 'false' });
  return { box: pgEl('div', { class: 'field' }, label, input), input };
}

function pgBanner(kind, id) {
  const title = pgEl('p', { class: 'banner-title' });
  const body = pgEl('p');
  const box = pgEl('div', { class: 'banner banner--box banner--' + kind, id, role: kind === 'danger' ? 'alert' : 'status', hidden: '' }, pgEl('div', { class: 'banner-body' }, title, body));
  return { box, title, body };
}

function pgDownload(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  const a = pgEl('a', { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => { URL.revokeObjectURL(url); }, MG_REVOKE_MS);
}

function pgStart() {
  // Frame guard, like the product: the page stays hidden when embedded in another page.
  if (window.top !== window.self) return;
  const view = document.getElementById('view');
  pgLang = (navigator.language || '').toLowerCase().startsWith('vi') ? 'vi' : 'en';

  const langBtn = pgEl('button', { type: 'button', class: 'btn', id: 'mg-lang' });
  pgSet(langBtn, 'lang.switch');
  const title = pgEl('h1', { class: 'screen-title' });
  pgSet(title, 'page.title');
  const lead = pgEl('p', { class: 'lead' });
  pgSet(lead, 'page.lead');

  const metaBanner = pgBanner('warn', 'mg-meta');
  const errBanner = pgBanner('danger', 'mg-error');
  const doneBanner = pgBanner('ok', 'mg-done');
  pgSet(doneBanner.body, 'done.body');

  const master = pgField('mg-master', 'form.master', 'password');
  const pw1 = pgField('mg-pw1', 'form.transfer', 'password', 'new-password');
  const pw2 = pgField('mg-pw2', 'form.transfer2', 'password', 'new-password');
  const hint = pgEl('p', { class: 'hint' });
  pgSet(hint, 'form.hint');
  const showId = 'mg-show';
  const show = pgEl('input', { type: 'checkbox', id: showId });
  const showLabel = pgEl('label', { for: showId });
  pgSet(showLabel, 'form.show');
  const formError = pgEl('p', { class: 'error', id: 'mg-form-error', role: 'alert', hidden: '' });
  const startBtn = pgEl('button', { type: 'submit', class: 'btn btn--primary btn--block', id: 'mg-start' });
  pgSet(startBtn, 'form.start');
  const form = pgEl('form', { class: 'stack', id: 'mg-form', novalidate: '' }, master.box, pw1.box, pw2.box, hint, pgEl('div', { class: 'check' }, show, showLabel), formError, startBtn);

  const progress = pgEl('p', { id: 'mg-progress', role: 'status' });
  const working = pgEl('div', { class: 'stack', id: 'mg-working', hidden: '' }, progress);

  const reviewBanner = pgBanner('warn', 'mg-review');
  const skippedHead = pgEl('p', { class: 'hint' });
  pgSet(skippedHead, 'review.list');
  const skippedList = pgEl('ul', { class: 'mg-skipped', id: 'mg-skipped' });
  const confirm = pgEl('input', { type: 'checkbox', id: 'mg-confirm' });
  const confirmLabel = pgEl('label', { for: 'mg-confirm' });
  pgSet(confirmLabel, 'review.confirm');
  const createBtn = pgEl('button', { type: 'button', class: 'btn btn--primary btn--block', id: 'mg-create', disabled: '' });
  const cancelBtn = pgEl('button', { type: 'button', class: 'btn btn--block', id: 'mg-cancel' });
  pgSet(cancelBtn, 'review.cancel');
  const review = pgEl('div', { class: 'stack', id: 'mg-review-box', hidden: '' }, reviewBanner.box, skippedHead, skippedList, pgEl('div', { class: 'check' }, confirm, confirmLabel), createBtn, cancelBtn);

  const dlBtn = pgEl('button', { type: 'button', class: 'btn btn--primary btn--block', id: 'mg-download' });
  const emptyHead = pgEl('p', { class: 'hint', id: 'mg-empty-head', hidden: '' });
  pgSet(emptyHead, 'done.emptyHead');
  const emptyList = pgEl('ul', { class: 'mg-skipped', id: 'mg-empty', hidden: '' });
  const partialNote = pgEl('p', { class: 'hint', id: 'mg-partial', hidden: '' });
  const v2Note = pgEl('p', { class: 'hint', id: 'mg-v2note', hidden: '' });
  const expired = pgEl('p', { class: 'hint', id: 'mg-expired', hidden: '' });
  pgSet(expired, 'done.expired');
  const after = pgEl('p', { class: 'hint' });
  pgSet(after, 'done.after');
  const againBtn = pgEl('button', { type: 'button', class: 'btn btn--block', id: 'mg-again' });
  pgSet(againBtn, 'done.again');
  const done = pgEl('div', { class: 'stack', id: 'mg-done-box', hidden: '' }, doneBanner.box, dlBtn, partialNote, v2Note, emptyHead, emptyList, expired, after, againBtn);

  const retryBtn = pgEl('button', { type: 'button', class: 'btn btn--block', id: 'mg-retry' });
  pgSet(retryBtn, 'err.again');
  const failed = pgEl('div', { class: 'stack', id: 'mg-failed', hidden: '' }, errBanner.box, retryBtn);

  const head = pgEl('div', { class: 'btn-row' }, langBtn);
  view.appendChild(pgEl('div', { class: 'pane-inner mg-pane' }, head, title, lead, metaBanner.box, form, working, review, done, failed));

  let state = 'form';
  let ctl = null;
  let ready = null; // {bytes, name, timer}
  let pending = null; // {result, transfer, timer}: a run that skipped items, waiting for the person's confirmation
  let gen = 0; // bumped whenever the page is hidden, restarted or fails: a run that sees a newer value drops its result

  const dropFile = () => {
    if (ready) { clearTimeout(ready.timer); ready = null; }
  };
  const dropPending = () => {
    if (pending) clearTimeout(pending.timer);
    pending = null;
    skippedList.replaceChildren();
    confirm.checked = false;
    createBtn.disabled = true;
  };
  const clearInputs = () => {
    master.input.value = '';
    pw1.input.value = '';
    pw2.input.value = '';
    show.checked = false;
    for (const i of [master.input, pw1.input, pw2.input]) i.setAttribute('type', 'password');
  };
  const setState = (next) => {
    state = next;
    view.setAttribute('data-state', next);
    form.hidden = next !== 'form' || metaBanner.blocked === true;
    working.hidden = next !== 'working';
    review.hidden = next !== 'review';
    done.hidden = next !== 'done';
    failed.hidden = next !== 'failed';
  };
  const showMeta = () => {
    let text = null;
    try { text = window.localStorage.getItem(MG_META_KEY); } catch { text = null; }
    try {
      parseLegacyMeta(text);
      metaBanner.box.hidden = true;
      metaBanner.blocked = false;
    } catch (e) {
      const bad = e instanceof MigrateError && e.code === 'BAD_META';
      pgSet(metaBanner.title, bad ? 'meta.badTitle' : 'meta.missingTitle');
      pgSet(metaBanner.body, bad ? 'meta.badBody' : 'meta.missingBody');
      metaBanner.box.setAttribute('data-code', bad ? 'BAD_META' : 'NO_META');
      metaBanner.box.hidden = false;
      metaBanner.blocked = true;
    }
    return text;
  };
  const fail = (e) => {
    gen += 1;
    const code = e instanceof MigrateError ? e.code : 'SERVER';
    const count = e instanceof MigrateError ? e.detail : 0;
    pgSet(errBanner.title, 'err.title');
    pgSet(errBanner.body, 'err.' + code, { count });
    errBanner.box.setAttribute('data-code', code);
    errBanner.box.hidden = false;
    clearInputs();
    dropPending();
    setState('failed');
  };
  const formProblem = (code, key) => {
    formError.setAttribute('data-code', code);
    pgSet(formError, key);
    formError.hidden = false;
  };

  const finish = async (result, transfer) => {
    const mine = gen;
    const partial = result.skipped.length > 0;
    setState('working');
    pgSet(progress, 'run.creating');
    const file = await createMigrationFile({ model: result.model, password: transfer });
    if (mine !== gen) throw new MigrateError('ABORTED'); // the page was hidden or reset while the file was being made
    const name = migrationFileName(Date.now(), { partial });
    dropFile();
    ready = { bytes: file.bytes, name, timer: setTimeout(() => { ready = null; dlBtn.hidden = true; expired.hidden = false; }, MG_HOLD_MS) };
    pgSet(doneBanner.title, 'done.title', { count: file.count });
    pgSet(dlBtn, 'done.download', { name });
    if (partial) pgSet(partialNote, 'done.partial', { skip: result.skipped.length });
    partialNote.hidden = !partial;
    if (result.v2Count > 0) pgSet(v2Note, 'done.v2note', { v2: result.v2Count });
    v2Note.hidden = result.v2Count === 0;
    emptyList.replaceChildren();
    for (const name of result.emptyItems) emptyList.appendChild(pgEl('li', null, document.createTextNode(name)));
    emptyHead.hidden = result.emptyItems.length === 0;
    emptyList.hidden = result.emptyItems.length === 0;
    doneBanner.box.hidden = false;
    dlBtn.hidden = false;
    expired.hidden = true;
    dropPending();
    setState('done');
  };

  const begin = async () => {
    formError.hidden = true;
    const masterText = master.input.value;
    const transfer = pw1.input.value;
    if (masterText === '') return formProblem('EMPTY', 'form.errEmpty');
    if (transfer !== pw2.input.value) return formProblem('MISMATCH', 'form.errMismatch');
    if (transfer === masterText) return formProblem('SAME', 'form.errSame');
    if (!meetsSecretBar(transfer).ok) return formProblem('WEAK', 'form.errWeak');
    const metaText = showMeta();
    if (metaBanner.blocked) return setState('form');
    clearInputs();
    ctl = new AbortController();
    const mine = ctl;
    setState('working');
    pgSet(progress, 'run.unlocking');
    try {
      const client = createGasClient({ gasUrl: MG_GAS_URL, fetchFn: (u, i) => window.fetch(u, i), signal: mine.signal });
      const result = await runMigration({
        client,
        metaText,
        master: masterText,
        now: Date.now(),
        signal: mine.signal,
        onProgress: (n, total) => pgSet(progress, 'run.reading', { done: n, total }),
      });
      if (result.skipped.length > 0) {
        // Items of another device: nothing is made until the person confirms what is left out.
        const counts = { ok: result.count, total: result.total, skip: result.skipped.length };
        pending = { result, transfer, timer: setTimeout(() => { if (pending) fail(new MigrateError('EXPIRED')); }, MG_HOLD_MS) };
        for (const name of result.skipped) skippedList.appendChild(pgEl('li', null, document.createTextNode(name)));
        pgSet(reviewBanner.title, 'review.title', counts);
        pgSet(reviewBanner.body, 'review.body', counts);
        pgSet(createBtn, 'review.create', counts);
        reviewBanner.box.hidden = false;
        setState('review');
      } else {
        await finish(result, transfer);
      }
    } catch (e) {
      fail(e);
    } finally {
      ctl = null;
    }
    return undefined;
  };

  form.addEventListener('submit', (ev) => { ev.preventDefault(); begin(); });
  show.addEventListener('change', () => {
    for (const i of [master.input, pw1.input, pw2.input]) i.setAttribute('type', show.checked ? 'text' : 'password');
  });
  dlBtn.addEventListener('click', () => { if (ready) pgDownload(ready.bytes, ready.name); });
  confirm.addEventListener('change', () => { createBtn.disabled = !confirm.checked || pending === null; });
  createBtn.addEventListener('click', async () => {
    if (!confirm.checked || pending === null) return;
    const { result, transfer } = pending;
    try {
      await finish(result, transfer);
    } catch (e) {
      fail(e);
    }
  });
  const restart = () => {
    gen += 1;
    dropFile();
    dropPending();
    clearInputs();
    errBanner.box.hidden = true;
    formError.hidden = true;
    showMeta();
    setState('form');
  };
  againBtn.addEventListener('click', restart);
  cancelBtn.addEventListener('click', restart);
  retryBtn.addEventListener('click', restart);
  langBtn.addEventListener('click', () => { pgLang = pgLang === 'vi' ? 'en' : 'vi'; pgRefresh(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    gen += 1;
    if (ctl) ctl.abort();
    else {
      clearInputs();
      if (pending) fail(new MigrateError('ABORTED')); // decrypted data and the transfer password do not wait in a hidden page
    }
  });

  showMeta();
  setState('form');
  pgRefresh();
  document.getElementById('app').hidden = false;
}

pgStart();
})();
</script>
